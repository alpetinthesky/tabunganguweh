<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Menabung Modern</title>
    <!-- Menggunakan Tailwind CSS untuk desain modern -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans p-6">

    <div class="max-w-md mx-auto">
        <!-- Header / Saldo -->
        <div class="bg-blue-600 rounded-3xl p-6 text-white shadow-lg mb-6">
            <p class="text-blue-100 text-sm font-semibold mb-1">Total Tabungan</p>
            <h1 class="text-4xl font-bold mb-4" id="totalSaldo">Rp 0</h1>
            <div class="flex justify-between text-sm">
                <div>
                    <p class="text-blue-200">Total Pemasukan</p>
                    <p class="font-semibold">+ Rp 0</p>
                </div>
                <div class="text-right">
                    <p class="text-blue-200">Total Pengeluaran</p>
                    <p class="font-semibold">- Rp 0</p>
                </div>
            </div>
        </div>

        <!-- Form Tambah Tabungan -->
        <div class="bg-white rounded-3xl p-6 shadow-sm mb-6 border border-gray-100">
            <h2 class="text-lg font-bold mb-4">Catat Transaksi</h2>
            <form id="savingForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Nama</label>
                    <input type="text" id="nama" class="w-full border-gray-300 rounded-xl p-3 bg-gray-50 outline-none focus:ring-2 focus:ring-blue-500" placeholder="Nama Penabung" required>
                </div>
                <div class="flex gap-4">
                    <div class="flex-1">
                        <label class="block text-sm font-medium text-gray-600 mb-1">Jenis</label>
                        <select id="jenis" class="w-full border-gray-300 rounded-xl p-3 bg-gray-50 outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="Setor">Setor</option>
                            <option value="Tarik">Tarik</option>
                        </select>
                    </div>
                    <div class="flex-1">
                        <label class="block text-sm font-medium text-gray-600 mb-1">Nominal (Rp)</label>
                        <input type="number" id="nominal" class="w-full border-gray-300 rounded-xl p-3 bg-gray-50 outline-none focus:ring-2 focus:ring-blue-500" placeholder="50000" required>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Keterangan</label>
                    <input type="text" id="keterangan" class="w-full border-gray-300 rounded-xl p-3 bg-gray-50 outline-none focus:ring-2 focus:ring-blue-500" placeholder="Misal: Uang saku minggu ini" required>
                </div>
                
                <button type="submit" class="w-full bg-blue-600 text-white rounded-xl p-3 font-semibold hover:bg-blue-700 transition" id="btnSubmit">
                    Simpan Transaksi
                </button>
            </form>
        </div>
    </div>

    <script>
        // GANTI URL INI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA NANTINYA
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbynVsjqF-AG5bJVqq6-_RWRU9Ojn7KOED0ayNT_UDoSGfssHexNCyE5RzLc3m5f0f-TIw/exec'; 

        document.getElementById('savingForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('btnSubmit');
            btn.innerText = 'Menyimpan...';
            btn.disabled = true;

            const data = {
                nama: document.getElementById('nama').value,
                jenis: document.getElementById('jenis').value,
                nominal: document.getElementById('nominal').value,
                keterangan: document.getElementById('keterangan').value
            };

            // Opsional: Kode ini mengirim data ke Google Sheets jika URL sudah diatur
            if(GOOGLE_SCRIPT_URL !== 'URL_WEB_APP_ANDA_DISINI') {
                fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors', // Penting untuk melewati isu CORS sederhana ke Google Apps Script
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                }).then(() => {
                    alert('Transaksi Berhasil Disimpan ke Spreadsheet!');
                    document.getElementById('savingForm').reset();
                    btn.innerText = 'Simpan Transaksi';
                    btn.disabled = false;
                }).catch(error => {
                    console.error('Error:', error);
                    alert('Gagal menyimpan.');
                    btn.innerText = 'Simpan Transaksi';
                    btn.disabled = false;
                });
            } else {
                // Simulasi jika belum di-konek ke script
                setTimeout(() => {
                    alert('Simulasi: Transaksi ' + data.jenis + ' Rp' + data.nominal + ' oleh ' + data.nama + ' berhasil!');
                    document.getElementById('savingForm').reset();
                    btn.innerText = 'Simpan Transaksi';
                    btn.disabled = false;
                }, 1000);
            }
        });
    </script>
</body>
</html>
